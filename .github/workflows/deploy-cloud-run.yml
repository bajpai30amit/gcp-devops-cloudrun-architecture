name: Cloud Run CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-cloud-run.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: watchful-idea-505906-u3
  REGION: us-central1
  REPOSITORY: devops-poc-docker
  IMAGE_NAME: devops-poc-app
  CLOUD_RUN_SERVICE: devops-poc-app

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/927189967365/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@watchful-idea-505906-u3.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" ./app

      - name: Push Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --service-account="app-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --quiet

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(status.url)")

          echo "Cloud Run URL: ${URL}"
          curl --fail --retry 5 --retry-delay 5 "${URL}/health"