
name: Cloud Run CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-cloud-run.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: watchful-idea-505906-u3
  REGION: us-central1
  REPOSITORY: devops-poc-docker
  IMAGE_NAME: devops-poc-app
  CLOUD_RUN_SERVICE: devops-poc-app
  RUNTIME_SERVICE_ACCOUNT: app-runtime@watchful-idea-505906-u3.iam.gserviceaccount.com

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Authenticate to GCP using Workload Identity Federation
      #    No service account JSON key is required.
      # -------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/927189967365/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@watchful-idea-505906-u3.iam.gserviceaccount.com

      # -------------------------------------------------------
      # 3. Install/configure gcloud CLI
      # -------------------------------------------------------
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # -------------------------------------------------------
      # 4. Configure Docker authentication for Artifact Registry
      # -------------------------------------------------------
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # -------------------------------------------------------
      # 5. Build Docker image using Git commit SHA as image tag
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building image: ${IMAGE}"

          docker build \
            -t "${IMAGE}" \
            ./app

      # -------------------------------------------------------
      # 6. Push Docker image to Artifact Registry
      # -------------------------------------------------------
      - name: Push Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Pushing image: ${IMAGE}"

          docker push "${IMAGE}"

      # -------------------------------------------------------
      # 7. Deploy new image to Cloud Run
      # -------------------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Deploying image: ${IMAGE}"

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --quiet

      # -------------------------------------------------------
      # 8. Ensure the POC Cloud Run service is publicly accessible
      #
      # This is required because terraform destroy removes the
      # allUsers -> roles/run.invoker IAM binding.
      # -------------------------------------------------------
      - name: Allow public access
        run: |
          gcloud run services add-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --member="allUsers" \
            --role="roles/run.invoker"

      # -------------------------------------------------------
      # 9. Get deployed Cloud Run URL
      # -------------------------------------------------------
      - name: Get Cloud Run URL
        id: cloud-run-url
        run: |
          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(status.url)")

          echo "Cloud Run URL: ${URL}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

      # -------------------------------------------------------
      # 10. Verify application health
      # -------------------------------------------------------
      - name: Verify deployment
        run: |
          URL="${{ steps.cloud-run-url.outputs.url }}"

          echo "Testing: ${URL}/health"

          curl \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${URL}/health"

          echo ""
          echo "Cloud Run deployment health check successful."
