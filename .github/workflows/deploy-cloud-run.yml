name: Cloud Run CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-cloud-run.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: watchful-idea-505906-u3
  REGION: us-central1
  REPOSITORY: devops-poc-docker
  IMAGE_NAME: devops-poc-app
  CLOUD_RUN_SERVICE: devops-poc-app

  RUNTIME_SERVICE_ACCOUNT: app-runtime@watchful-idea-505906-u3.iam.gserviceaccount.com

  PROMETHEUS_SIDECAR_IMAGE: us-docker.pkg.dev/cloud-ops-agents-artifacts/cloud-run-gmp-sidecar/cloud-run-gmp-sidecar:1.2.0

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # 2. Authenticate to GCP using Workload Identity
      # -------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/927189967365/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@watchful-idea-505906-u3.iam.gserviceaccount.com


      # -------------------------------------------------------
      # 3. Configure gcloud
      # -------------------------------------------------------
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2


      # -------------------------------------------------------
      # 4. Configure Docker authentication
      # -------------------------------------------------------
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet


      # -------------------------------------------------------
      # 5. Build application Docker image
      #
      # Every deployment gets an immutable Git SHA tag.
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building image:"
          echo "${IMAGE}"

          docker build \
            -t "${IMAGE}" \
            ./app


      # -------------------------------------------------------
      # 6. Push application image to Artifact Registry
      # -------------------------------------------------------
      - name: Push Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Pushing image:"
          echo "${IMAGE}"

          docker push "${IMAGE}"


      # -------------------------------------------------------
      # 7. Deploy multi-container Cloud Run revision
      #
      # Container 1:
      #   app
      #   Flask application
      #   Port 8080
      #
      # Container 2:
      #   collector
      #   Managed Service for Prometheus sidecar
      #
      # Explicitly declaring both containers prevents the
      # Prometheus sidecar from disappearing during app deploys.
      # -------------------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Deploying application image:"
          echo "${IMAGE}"

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --container="app" \
            --image="${IMAGE}" \
            --port="8080" \
            --container="collector" \
            --image="${PROMETHEUS_SIDECAR_IMAGE}"



      # -------------------------------------------------------
      # 8. Ensure public access
      #
      # POC only.
      # -------------------------------------------------------
      - name: Allow public access
        run: |
          gcloud run services add-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --member="allUsers" \
            --role="roles/run.invoker"


      # -------------------------------------------------------
      # 9. Get Cloud Run URL
      # -------------------------------------------------------
      - name: Get Cloud Run URL
        id: cloud-run-url
        run: |
          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(status.url)")

          echo "Cloud Run URL: ${URL}"

          echo "url=${URL}" >> "${GITHUB_OUTPUT}"


      # -------------------------------------------------------
      # 10. Verify application health
      # -------------------------------------------------------
      - name: Verify application health
        run: |
          URL="${{ steps.cloud-run-url.outputs.url }}"

          echo "Testing application:"
          echo "${URL}/health"

          curl \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${URL}/health"

          echo ""
          echo "Application health check successful."


      # -------------------------------------------------------
      # 11. Verify Prometheus endpoint
      # -------------------------------------------------------
      - name: Verify Prometheus metrics endpoint
        run: |
          URL="${{ steps.cloud-run-url.outputs.url }}"

          echo "Testing Prometheus endpoint:"
          echo "${URL}/metrics"

          curl \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${URL}/metrics" \
            | grep "http_request"

          echo ""
          echo "Prometheus metrics endpoint verified."


      # -------------------------------------------------------
      # 12. Display deployed Cloud Run revision
      # -------------------------------------------------------
      - name: Show deployed revision
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="yaml(
              status.latestReadyRevisionName,
              status.url,
              spec.template.spec.containers
            )"